name: CI
permissions:
  # A reusable workflow can only narrow the caller's token, never widen it, so every
  # scope the shared workflow's jobs need has to be granted here. Without
  # pull-requests/checks/issues the reviewdog suggester and the test-result publisher
  # fail silently rather than loudly.
  contents: read
  checks: write
  pull-requests: write
  issues: write
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs:
  # Delegate to the psake org's shared module CI workflow. It runs the full build and
  # test suite on PowerShell 7+ across Linux/Windows/macOS and on the real Windows
  # PowerShell 5.1 (Desktop) engine, plus linting and changelog format validation.
  ci:
    name: CI
    uses: psake/.github/.github/workflows/ModuleCI.yml@main
